<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf2f7" />
    <title>一眼成对 · 200 枚原创符号</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #edf2f7;
        --surface: #fff;
        --ink: #1a3149;
        --muted: #526779;
        --blue: #285f86;
        --border: #c4d2de;
        --hover: #e0e9f1;
        --size: 48px;
        font:
          14px/1.5 system-ui,
          -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        accent-color: var(--blue);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      input,
      select,
      .download {
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      button {
        padding: 8px 14px;
      }
      button:hover,
      .tile:hover {
        background: var(--hover);
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      input {
        caret-color: var(--blue);
      }
      ::selection {
        background: #c7dfef;
        color: var(--ink);
      }
      * {
        scrollbar-color: #8fa7b9 var(--bg);
      }
      a {
        color: var(--blue);
        text-underline-offset: 3px;
      }
      .wrap {
        max-width: 1280px;
        margin: auto;
        padding: 32px 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 24px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 26px;
        line-height: 1.35;
        letter-spacing: -0.025em;
        margin: 0 0 8px;
      }
      header p {
        margin: 0;
        color: var(--muted);
        max-width: 68ch;
      }
      .draft {
        font-size: 13px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        white-space: nowrap;
        background: var(--surface);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: end;
        padding: 20px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field > span,
      legend {
        font-size: 13px;
        font-weight: 600;
      }
      .search {
        flex: 1;
        min-width: 220px;
      }
      input[type='search'] {
        width: 100%;
        padding: 10px 12px;
      }
      select {
        padding: 9px 34px 9px 12px;
        max-width: 100%;
      }
      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        padding: 0 0 6px;
      }
      .sizes {
        display: flex;
        gap: 4px;
      }
      .sizes button {
        min-width: 46px;
        padding: 8px;
      }
      .sizes [aria-pressed='true'] {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
      }
      .rotation {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
      input[type='checkbox'] {
        width: 18px;
        height: 18px;
        min-height: 0;
        margin: 0;
      }
      .summary {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: baseline;
        margin: 20px 0 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .summary strong {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
        gap: 1px;
        background: var(--border);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .tile {
        border: 0;
        border-radius: 0;
        padding: 16px 8px 12px;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .art {
        height: 88px;
        display: grid;
        place-items: center;
        width: 100%;
      }
      .art svg {
        width: var(--size);
        height: var(--size);
        transform: rotate(var(--angle, 0deg));
        flex: none;
      }
      .name {
        font-weight: 600;
      }
      .id {
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
        line-height: 1.4;
      }
      .tile:focus-visible {
        outline-offset: -4px;
      }
      .empty {
        text-align: center;
        padding: 56px 16px;
      }
      .empty p {
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      .detail {
        margin-top: 24px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        padding: 24px;
        display: flex;
        gap: 24px;
        align-items: center;
        scroll-margin: 20px;
      }
      .detail svg {
        width: 160px;
        height: 160px;
        flex: none;
      }
      .detail h2 {
        font-size: 21px;
        margin: 0 0 6px;
      }
      .detail p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .download {
        display: inline-flex;
        align-items: center;
        padding: 8px 14px;
        background: var(--blue);
        color: white;
        text-decoration: none;
      }
      .detail button {
        margin-left: auto;
        align-self: start;
      }
      footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 12px;
      }
      footer p {
        margin: 4px 0;
      }
      @media (max-width: 600px) {
        .wrap {
          padding: 20px 16px;
        }
        header {
          gap: 12px;
          flex-direction: column;
          margin-bottom: 20px;
        }
        h1 {
          font-size: 23px;
        }
        .controls {
          gap: 12px;
        }
        .search {
          flex-basis: 100%;
        }
        .category {
          flex: 1;
          min-width: 150px;
        }
        .grid {
          grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        }
        .tile {
          padding: 12px 4px;
        }
        .summary {
          align-items: start;
        }
        .summary span:last-child {
          text-align: right;
          max-width: 140px;
        }
        .detail {
          flex-wrap: wrap;
          padding: 16px;
          gap: 16px;
        }
        .detail svg {
          width: 112px;
          height: 112px;
        }
        .detail button {
          margin-left: 0;
        }
        .detail-copy {
          flex: 1;
          min-width: 140px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <div>
          <h1>一眼成对 · 原创符号库</h1>
          <p>
            200 个不同主题，8
            个分类。检查小尺寸辨识度、轮廓差异与旋转后的表现；点击图案可查看大图并下载 SVG。
          </p>
        </div>
        <span class="draft">评审草稿 · 非定稿</span>
      </header>
      <section class="controls" aria-label="筛选与预览设置">
        <label class="field search"
          ><span>搜索符号</span
          ><input
            id="search"
            type="search"
            placeholder="中文名称或英文 ID，如：苹果 / apple"
            autocomplete="off"
        /></label>
        <label class="field category"
          ><span>分类</span
          ><select id="category">
            <option value="">全部分类 · 200</option>
          </select></label
        >
        <fieldset>
          <legend>图案尺寸（px）</legend>
          <div class="sizes" aria-label="图案像素尺寸">
            <button type="button" data-size="32" aria-pressed="false">32</button
            ><button type="button" data-size="48" aria-pressed="true">48</button
            ><button type="button" data-size="72" aria-pressed="false">72</button>
          </div>
        </fieldset>
        <label class="rotation"><input id="rotation" type="checkbox" />旋转预览</label>
      </section>
      <div class="summary">
        <span id="count" role="status" aria-live="polite"></span><span>64 × 64 矢量画布</span>
      </div>
      <div id="grid" class="grid" aria-label="符号目录"></div>
      <section id="empty" class="empty" hidden>
        <h2>没有找到匹配符号</h2>
        <p>试试更短的名称，或清除分类和搜索条件。</p>
        <button id="reset" type="button">清除筛选</button>
      </section>
      <section id="detail" class="detail" aria-label="符号详情" tabindex="-1" hidden>
        <div id="detail-art"></div>
        <div class="detail-copy">
          <h2 id="detail-name"></h2>
          <p id="detail-meta"></p>
          <a id="download" class="download">下载 SVG</a>
        </div>
        <button id="close" type="button">收起详情</button>
      </section>
      <footer>
        <p>原创手绘路径草稿：不是颜色变体合集，不使用外部图片、字体或网络请求。</p>
        <p>
          当前用于视觉评审，尚未完成逐个主题的实机辨识测试。支持离线打开；独立文件位于
          symbols/，元数据见 catalog.json。
        </p>
      </footer>
      <noscript
        ><p>
          请启用 JavaScript 查看完整的 200 枚符号；也可直接打开 symbols/ 中的 SVG 文件。
        </p></noscript
      >
    </main>

    <script>
      const catalog = JSON.parse(document.getElementById('catalog-data').textContent);
      const grid = document.getElementById('grid'),
        search = document.getElementById('search'),
        category = document.getElementById('category'),
        rotation = document.getElementById('rotation'),
        detail = document.getElementById('detail');
      let selectedButton = null,
        downloadUrl = null;
      for (const name of new Set(catalog.map((s) => s.category))) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name + ' · ' + catalog.filter((s) => s.category === name).length;
        category.append(option);
      }
      function hideDetail() {
        detail.hidden = true;
        if (downloadUrl) {
          URL.revokeObjectURL(downloadUrl);
          downloadUrl = null;
        }
      }
      function showDetail(symbol, button) {
        hideDetail();
        selectedButton = button;
        document.getElementById('detail-art').innerHTML = symbol.svg.replaceAll(
          symbol.id + '-title',
          symbol.id + '-detail-title',
        );
        document.getElementById('detail-name').textContent = symbol.name;
        document.getElementById('detail-meta').textContent =
          symbol.id + ' · ' + symbol.category + ' · SVG';
        downloadUrl = URL.createObjectURL(
          new Blob([symbol.svg], { type: 'image/svg+xml;charset=utf-8' }),
        );
        const link = document.getElementById('download');
        link.href = downloadUrl;
        link.download = symbol.id + '.svg';
        detail.hidden = false;
        detail.scrollIntoView({ block: 'nearest' });
        detail.focus({ preventScroll: true });
      }
      function render() {
        hideDetail();
        grid.replaceChildren();
        const query = search.value.trim().toLocaleLowerCase();
        const visible = catalog.filter(
          (s) =>
            (!category.value || s.category === category.value) &&
            (!query || (s.name + ' ' + s.id).toLocaleLowerCase().includes(query)),
        );
        for (const symbol of visible) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'tile';
          button.setAttribute('aria-label', '查看' + symbol.name + ' · ' + symbol.id);
          const art = document.createElement('span');
          art.className = 'art';
          art.setAttribute('aria-hidden', 'true');
          art.innerHTML = symbol.svg;
          const angle = ((catalog.indexOf(symbol) * 47) % 121) - 60;
          art.style.setProperty('--angle', rotation.checked ? angle + 'deg' : '0deg');
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = symbol.name;
          const id = document.createElement('span');
          id.className = 'id';
          id.textContent = symbol.id;
          button.append(art, name, id);
          button.addEventListener('click', () => showDetail(symbol, button));
          grid.append(button);
        }
        document.getElementById('count').innerHTML =
          '显示 <strong>' + visible.length + '</strong> / 200 枚符号';
        grid.hidden = visible.length === 0;
        document.getElementById('empty').hidden = visible.length !== 0;
      }
      search.addEventListener('input', render);
      category.addEventListener('change', render);
      rotation.addEventListener('change', render);
      for (const button of document.querySelectorAll('[data-size]'))
        button.addEventListener('click', () => {
          document.documentElement.style.setProperty('--size', button.dataset.size + 'px');
          for (const other of document.querySelectorAll('[data-size]'))
            other.setAttribute('aria-pressed', String(other === button));
        });
      document.getElementById('reset').addEventListener('click', () => {
        search.value = '';
        category.value = '';
        render();
        search.focus();
      });
      document.getElementById('close').addEventListener('click', () => {
        hideDetail();
        if (selectedButton?.isConnected) selectedButton.focus();
      });
      detail.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          hideDetail();
          if (selectedButton?.isConnected) selectedButton.focus();
        }
      });
      render();
    </script>
  </body>
</html>
