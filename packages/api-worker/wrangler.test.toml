#:schema ./node_modules/wrangler/config-schema.json
# ── Test-only wrangler config ────────────────────────────────────────────────
# Used by vitest-pool-workers. Excludes remote-only routes and triggers so tests
# run locally via miniflare without Cloudflare auth.
name = "werewolf-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ── Env vars (test-only) ─────────────────────────────────────────────────────
[vars]
JWT_SECRET = "e2e-test-jwt-secret-do-not-use-in-production"
ADMIN_PASSWORD = "test-admin-token-do-not-use-in-production"
ENVIRONMENT = "test"
FIB_WORD_SUPPLY_ENABLED = "false"
UNDERCOVER_WORD_SUPPLY_ENABLED = "false"
TAVILY_API_KEY = "test-key"
CLOUDFLARE_ACCOUNT_ID = "test-cloudflare-account"
CLOUDFLARE_WORKER_SCRIPT_NAME = "werewolf-api"
SENTRY_DSN = ""

# ── D1 Database (local miniflare) ───────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "werewolf-db"
database_id = "f6ddfa17-8a27-442c-b6c0-6abf56f06a43"

# ── R2 Bucket (local miniflare) ─────────────────────────────────────────────
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "werewolf-avatars"

[[r2_buckets]]
binding = "GAME_MEDIA"
bucket_name = "werewolf-game-media"

# ── Analytics Engine ────────────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "AI_USAGE"
dataset = "ai_usage_test"

[[analytics_engine_datasets]]
binding = "REQUEST_TRAFFIC"
dataset = "request_traffic_test"

# ── Durable Objects ─────────────────────────────────────────────────────────
[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" }
]

[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# NOTE: [[routes]] and [triggers] are intentionally omitted.

[[workflows]]
name = "fib-word-supply"
binding = "FIB_WORD_SUPPLY"
class_name = "FibWordSupplyWorkflow"

[[workflows]]
name = "undercover-word-supply"
binding = "UNDERCOVER_WORD_SUPPLY"
class_name = "UndercoverWordSupplyWorkflow"
