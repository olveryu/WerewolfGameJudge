#:schema ./node_modules/wrangler/config-schema.json
# Browser E2E Worker composition. Keeps failure injection out of production and Vitest entrypoints.
name = "werewolf-api"
main = "src/e2e/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
JWT_SECRET = "e2e-test-jwt-secret-do-not-use-in-production"
ADMIN_PASSWORD = "test-admin-token-do-not-use-in-production"
ENVIRONMENT = "test"
CLOUDFLARE_ACCOUNT_ID = "test-cloudflare-account"
CLOUDFLARE_WORKER_SCRIPT_NAME = "werewolf-api"
SENTRY_DSN = ""

[[d1_databases]]
binding = "DB"
database_name = "werewolf-db"
database_id = "f6ddfa17-8a27-442c-b6c0-6abf56f06a43"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "werewolf-avatars"

[[r2_buckets]]
binding = "GAME_MEDIA"
bucket_name = "werewolf-game-media"

[[analytics_engine_datasets]]
binding = "REQUEST_TRAFFIC"
dataset = "request_traffic_e2e"

# ── Rate limiting (capability model: knowing a room code is the authorization,
#    so the code must not be enumerable; see docs/realtime-link-redesign.md §5.2) ──
# Room directory lookups and socket upgrades per authenticated user.
[[ratelimits]]
name = "ROOM_LOOKUP_LIMITER"
namespace_id = "1001"

  # E2E drives whole boards from 127.0.0.1; budgets exist for binding parity, not enforcement.
  [ratelimits.simple]
  limit = 10000
  period = 60

# Anonymous sign-ups per client IP (free accounts must not multiply the lookup budget).
[[ratelimits]]
name = "ANONYMOUS_SIGNUP_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10000
  period = 60

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" }
]

[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
