#:schema ./node_modules/wrangler/config-schema.json
# Browser E2E Worker composition. Keeps failure injection out of production and Vitest entrypoints.
name = "werewolf-api"
main = "src/e2e/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
JWT_SECRET = "e2e-test-jwt-secret-do-not-use-in-production"
ADMIN_PASSWORD = "test-admin-token-do-not-use-in-production"
ENVIRONMENT = "test"
CLOUDFLARE_ACCOUNT_ID = "test-cloudflare-account"
SENTRY_DSN = ""

[[d1_databases]]
binding = "DB"
database_name = "werewolf-db"
database_id = "f6ddfa17-8a27-442c-b6c0-6abf56f06a43"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "werewolf-avatars"

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" }
]

[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
