name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build game-engine
        run: pnpm --filter @game-judge/game-engine run build

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Test
        run: pnpm run test:all

  deploy-api-worker:
    runs-on: ubuntu-latest
    if: |
      needs.quality.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: quality
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build game-engine (api-worker dependency)
        run: pnpm --filter @game-judge/game-engine run build

      - name: Apply D1 migrations
        run: pnpm --filter @game-judge/api-worker run db:migrate:remote

      - name: Deploy API Worker
        run: pnpm --filter @game-judge/api-worker run deploy

  deploy-frontend:
    runs-on: ubuntu-latest
    if: |
      needs.quality.result == 'success' &&
      needs.deploy-api-worker.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [quality, deploy-api-worker]
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # OIDC trusted publishing requires npm >= 11.5.1 (Node 22 ships npm 10.x)
      - run: npm install -g npm@11

      - name: Build
        run: bash scripts/build.sh
        env:
          CF_PAGES_BRANCH: main
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Rewrite asset URLs BEFORE npm publish so CDN-hosted JS files
      # contain absolute CDN URLs for dynamic chunks (App.js, etc.)
      - name: Rewrite asset URLs to use CDN
        id: cdn
        run: |
          PKG_VERSION="0.0.0-g${GITHUB_SHA::8}"
          CDN_BASE="https://cdn.npmmirror.com/packages/werewolf-judge-cdn/${PKG_VERSION}/files"

          # JS bundles: rewrite "/assets/ string literals to CDN (Metro chunk references)
          for jsfile in dist/assets/js/*.js; do
            sed -i "s|\"/assets/|\"${CDN_BASE}/assets/|g" "$jsfile"
            # Replace WASM placeholder with versioned CDN URL for pre-compressed canvaskit
            sed -i "s|__CANVASKIT_WASM_GZ_URL__|${CDN_BASE}/wasm/canvaskit.wasm.gz|g" "$jsfile"
          done

          # HTML: rewrite src="/assets/... and href="/assets/... to CDN
          sed -i "s|src=\"/assets/|src=\"${CDN_BASE}/assets/|g" dist/index.html
          sed -i "s|href=\"/assets/|href=\"${CDN_BASE}/assets/|g" dist/index.html

          echo "cdn_base=$CDN_BASE" >> "$GITHUB_OUTPUT"
          echo "✅ All asset URLs rewritten to ${CDN_BASE}"

      # Publish REWRITTEN assets to npm → npmmirror CDN (OIDC trusted publishing, no token needed)
      - name: Publish assets to npm
        id: npm
        run: |
          PKG_VERSION="0.0.0-g${GITHUB_SHA::8}"
          WORK=$(mktemp -d)

          # Copy already-rewritten assets/ tree (JS bundles have CDN URLs baked in)
          cp -r dist/assets "$WORK/assets"

          # Pre-compress CanvasKit WASM for CDN delivery (8 MB → ~3.2 MB gzip).
          # Client fetches .wasm.gz and decompresses via DecompressionStream.
          # cp first: pnpm hardlinks node_modules files, gzip -k refuses multi-link targets.
          mkdir -p "$WORK/wasm"
          cp node_modules/canvaskit-wasm/bin/full/canvaskit.wasm "$WORK/wasm/canvaskit.wasm"
          gzip -9 "$WORK/wasm/canvaskit.wasm"

          # Generate index.js — importable manifest of all bundled assets
          FILES=$(cd "$WORK" && find assets wasm -type f | sort)
          {
            echo '"use strict";'
            echo "const VERSION = \"$PKG_VERSION\";"
            echo "const ASSETS = ["
            for f in $FILES; do
              echo "  \"$f\","
            done
            echo "];"
            echo "module.exports = { version: VERSION, assets: ASSETS };"
          } > "$WORK/index.js"

          cat > "$WORK/README.md" << 'EOF'
          # werewolf-judge-cdn

          Runtime asset loader and manifest for the [WerewolfJudge](https://github.com/olveryu/WerewolfGameJudge) web app.

          Provides a versioned manifest of all bundled assets (fonts, audio sprites, image bundles)
          so that Service Workers, deployment scripts, and build tools can enumerate and pre-cache them.

          ## Installation

          ```bash
          npm install werewolf-judge-cdn
          ```

          ## Usage

          ```js
          const { version, assets } = require('werewolf-judge-cdn');
          // version — semver string tied to the build commit
          // assets  — array of relative asset paths for cache pre-warming
          ```

          ## License

          MIT
          EOF
          # Trim leading spaces from heredoc (YAML indent)
          sed -i 's/^          //' "$WORK/README.md"

          printf '{"name":"werewolf-judge-cdn","version":"%s","description":"Runtime asset loader and manifest for the WerewolfJudge web app — fonts, audio sprites, and image bundles","license":"MIT","keywords":["werewolf","assets","manifest","loader"],"main":"index.js","files":["index.js","assets/","wasm/","README.md"],"repository":{"type":"git","url":"https://github.com/olveryu/WerewolfGameJudge.git"}}' "$PKG_VERSION" > "$WORK/package.json"
          cd "$WORK"
          # Idempotent publish: skip if this version already exists on npm
          # (happens when a reverted commit re-lands with the same SHA)
          if npm view "werewolf-judge-cdn@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "⏭️ werewolf-judge-cdn@$PKG_VERSION already published — skipping"
          else
            npm publish --access public --tag latest
            echo "✅ Published werewolf-judge-cdn@$PKG_VERSION"
          fi

          # Gate: confirm version is visible on npm registry before proceeding.
          # npm registry is eventually consistent — poll until the version resolves.
          echo "⏳ Waiting for npm registry to confirm $PKG_VERSION..."
          for i in $(seq 1 24); do
            if npm view "werewolf-judge-cdn@$PKG_VERSION" version >/dev/null 2>&1; then
              echo "✅ npm registry confirms $PKG_VERSION (after $((i*5))s)"
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "❌ npm registry did not propagate $PKG_VERSION within 120s — aborting"
              exit 1
            fi
            sleep 5
          done

          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync npmmirror and verify CDN
        run: |
          set -euo pipefail

          PKG_VERSION="${{ steps.npm.outputs.version }}"
          CDN_BASE="https://cdn.npmmirror.com/packages/werewolf-judge-cdn/${PKG_VERSION}/files"
          SYNC_ENDPOINT="https://registry-direct.npmmirror.com/-/package/werewolf-judge-cdn/syncs"
          REGISTRY_URL="https://registry-direct.npmmirror.com/werewolf-judge-cdn/${PKG_VERSION}"
          CDN_URL="${CDN_BASE}/index.js"
          CHECK_INTERVAL_SECONDS=5
          SYNC_RETRY_INTERVAL_SECONDS=180
          MAX_WAIT_SECONDS=900
          REQUEST_TIMEOUT_SECONDS=30
          NEXT_SYNC_AT_SECONDS=$SYNC_RETRY_INTERVAL_SECONDS
          REGISTRY_RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$REGISTRY_RESPONSE_FILE"' EXIT

          trigger_sync() {
            if ! SYNC_RESP=$(curl --fail --silent --show-error \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              --request PUT "$SYNC_ENDPOINT"); then
              echo "⚠️ npmmirror sync trigger failed; artifact polling will continue"
              return
            fi

            SYNC_ID=$(python3 -c \
              "import json,sys; data=json.load(sys.stdin); task_id=data['id']; assert task_id; print(task_id)" \
              <<< "$SYNC_RESP")
            echo "🔄 npmmirror sync triggered: $SYNC_ID"
          }

          report_sync_state() {
            if [ -z "$SYNC_ID" ]; then
              echo "ℹ️ No npmmirror sync task ID is available"
              return
            fi

            if ! SYNC_RESP=$(curl --fail --silent --show-error \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              "${SYNC_ENDPOINT}/${SYNC_ID}"); then
              echo "⚠️ Could not read npmmirror sync task $SYNC_ID"
              return
            fi

            STATE=$(python3 -c \
              "import json,sys; print(json.load(sys.stdin).get('state', 'unknown'))" \
              <<< "$SYNC_RESP")
            echo "ℹ️ npmmirror sync task $SYNC_ID state: $STATE (diagnostic only)"
          }

          SYNC_ID=""
          trigger_sync
          SECONDS=0

          while [ "$SECONDS" -le "$MAX_WAIT_SECONDS" ]; do
            if ! REGISTRY_HTTP_CODE=$(curl --silent --show-error \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              --output "$REGISTRY_RESPONSE_FILE" \
              --write-out "%{http_code}" \
              "$REGISTRY_URL"); then
              REGISTRY_HTTP_CODE="request-error"
              echo "⚠️ npmmirror registry request failed; retrying"
            fi

            VERSION_CHECK=""
            if [ "$REGISTRY_HTTP_CODE" = "200" ]; then
              VERSION_CHECK=$(python3 -c \
                "import json,sys; version=json.load(open(sys.argv[1]))['version']; assert isinstance(version, str); print(version)" \
                "$REGISTRY_RESPONSE_FILE")
            fi

            if ! CDN_HTTP_CODE=$(curl --silent --show-error \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$CDN_URL"); then
              CDN_HTTP_CODE="request-error"
              echo "⚠️ npmmirror CDN request failed; retrying"
            fi

            if [ "$VERSION_CHECK" = "$PKG_VERSION" ] && [ "$CDN_HTTP_CODE" = "200" ]; then
              echo "✅ npmmirror registry and CDN confirmed $PKG_VERSION after ${SECONDS}s"
              exit 0
            fi

            echo "⏳ Waiting for npmmirror artifacts (${SECONDS}s/${MAX_WAIT_SECONDS}s): registry=$REGISTRY_HTTP_CODE version=${VERSION_CHECK:-missing}, CDN=$CDN_HTTP_CODE"

            if [ "$SECONDS" -ge "$MAX_WAIT_SECONDS" ]; then
              break
            fi

            if [ "$SECONDS" -ge "$NEXT_SYNC_AT_SECONDS" ]; then
              report_sync_state
              trigger_sync
              NEXT_SYNC_AT_SECONDS=$((SECONDS + SYNC_RETRY_INTERVAL_SECONDS))
            fi

            sleep "$CHECK_INTERVAL_SECONDS"
          done

          report_sync_state
          echo "❌ npmmirror artifacts unavailable after ${MAX_WAIT_SECONDS}s — aborting deploy"
          echo "   Registry: $REGISTRY_URL → $REGISTRY_HTTP_CODE (${VERSION_CHECK:-missing})"
          echo "   CDN: $CDN_URL → $CDN_HTTP_CODE"
          if [ -n "$SYNC_ID" ]; then
            echo "   Last sync task: ${SYNC_ENDPOINT}/${SYNC_ID}"
          fi
          exit 1

      # Cloudflare Pages API rejects non-ASCII commit messages.
      # Our convention: subject line (first line) is always ASCII (Conventional Commits).
      # Extract it explicitly so deployments stay human-readable + API-safe.
      - name: Extract commit subject
        id: commit
        run: echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: pages deploy dist --project-name=werewolfgamejudge --commit-message="${{ steps.commit.outputs.subject }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-miniapp:
    runs-on: ubuntu-latest
    if: |
      needs.quality.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check miniapp changes
        id: changes
        run: |
          # Upload on release commits OR miniapp/ file changes
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if echo "$COMMIT_MSG" | grep -q '^release:'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD -- miniapp/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version-file: '.nvmrc'

      - name: Upload to WeChat Mini Program
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "${{ secrets.MINIAPP_UPLOAD_KEY }}" > /tmp/miniapp-key.pem
          VERSION=$(node -p "require('./package.json').version")
          npx miniprogram-ci upload \
            --pp miniapp \
            --pkp /tmp/miniapp-key.pem \
            --appid wx7f0c3bea5873908c \
            --uv "$VERSION" \
            --desc "CI deploy: $(git log -1 --pretty=%s)" \
            -r 1
          rm -f /tmp/miniapp-key.pem

  e2e:
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.quality.result == 'success'
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Balanced by measured runtime (target ~13min each) ──
          - shard: 1
            specs: 'night-roles-check.spec.ts'
          - shard: 2
            specs: 'reconnect.spec.ts night-roles-block.spec.ts'
          - shard: 3
            specs: 'night-roles-kill.spec.ts night-roles-protect.spec.ts night-roles-piper.spec.ts night-roles-gargoyle.spec.ts'
          - shard: 4
            specs: 'entry-flow.spec.ts db-recovery.spec.ts seating.spec.ts night-roles-eclipse-wolf-queen.spec.ts night-roles-thief-cupid.spec.ts night-roles-treasure.spec.ts night-verify.spec.ts night-2p.spec.ts night-6p.spec.ts offline-recovery-canary.spec.ts rejoin.spec.ts restart.spec.ts room-lifecycle.spec.ts home.spec.ts config.spec.ts'
          - shard: 5
            specs: 'fibking.spec.ts fibking-responsive.spec.ts night-roles-hidden-wolf-crow.spec.ts'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # ── Playwright ──────────────────────────────────────
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/5)
        run: pnpm exec playwright test ${{ matrix.specs }} --reporter=list --reporter=blob

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    runs-on: ubuntu-latest
    if: always() && needs.e2e.result != 'skipped'
    needs: e2e
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload merged report artifact
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Pages artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  deploy-e2e-report:
    runs-on: ubuntu-latest
    if: |
      needs.merge-reports.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: merge-reports
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Add report link to summary
        run: |
          echo "## 📊 Playwright Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 [View Report](${{ steps.deploy.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
