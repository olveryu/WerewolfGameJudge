name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build game-engine
        run: pnpm --filter @game-judge/game-engine run build

      - name: Check unused files and dependencies
        run: pnpm run knip

      - name: Check agent configuration drift
        run: pnpm run sync:agents:check

  # Lint and format check run as their own job so they parallelize with
  # quality / test-root instead of serializing inside quality.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

  # Root jest + game-engine vitest, sharded across 2 runners (mirrors the
  # test-api-worker sharding below). This was the last step of quality and
  # its long pole (~4min of quality's ~8min); as its own job it runs in
  # parallel with quality and lint.
  # Shard flags go directly after `run test` with NO `--` separator: pnpm
  # forwards a literal `--` to the script, which makes jest treat --shard
  # as a path pattern (0 matches) and vitest ignore the flag entirely.
  test-root:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build game-engine
        run: pnpm --filter @game-judge/game-engine run build

      # JSON results ride along on both runners (vitest and jest emit the
      # same JSON shape) so the failure-digest job can fold unit failures
      # into the digest and the flake ledger. Paths are absolute because
      # pnpm --filter runs each suite inside its package directory.
      - name: Test game-engine (shard ${{ matrix.shard }}/2)
        run: pnpm --filter @game-judge/game-engine run test --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=${{ github.workspace }}/test-results-engine-${{ matrix.shard }}.json

      - name: Test root (shard ${{ matrix.shard }}/2)
        run: pnpm --filter werewolfgamejudge run test --shard=${{ matrix.shard }}/2 --json --outputFile=${{ github.workspace }}/test-results-root-${{ matrix.shard }}.json

      - name: Upload unit test results (shard ${{ matrix.shard }}/2)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-root-${{ matrix.shard }}
          path: |
            test-results-root-${{ matrix.shard }}.json
            test-results-engine-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # api-worker tests are slow (Miniflare + D1). Shard across 3 runners.
  test-api-worker:
    runs-on: ubuntu-latest
    needs: [quality, lint, test-root]
    if: |
      always() &&
      needs.quality.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-root.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Test api-worker (shard ${{ matrix.shard }}/3)
        run: pnpm --filter @game-judge/api-worker run test --shard=${{ matrix.shard }}/3 --reporter=default --reporter=json --outputFile=${{ github.workspace }}/test-results-api-${{ matrix.shard }}.json

      - name: Upload unit test results (shard ${{ matrix.shard }}/3)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-api-${{ matrix.shard }}
          path: test-results-api-${{ matrix.shard }}.json
          if-no-files-found: ignore

  deploy-api-worker:
    runs-on: ubuntu-latest
    if: |
      needs.quality.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-root.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [quality, lint, test-root]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build game-engine (api-worker dependency)
        run: pnpm --filter @game-judge/game-engine run build

      - name: Apply D1 migrations
        run: pnpm --filter @game-judge/api-worker run db:migrate:remote

      - name: Deploy API Worker
        run: pnpm --filter @game-judge/api-worker run deploy

  deploy-frontend:
    runs-on: ubuntu-latest
    if: |
      needs.quality.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-root.result == 'success' &&
      needs.deploy-api-worker.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [quality, lint, test-root, deploy-api-worker]
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # OIDC trusted publishing requires npm >= 11.5.1 (Node 22 ships npm 10.x)
      - run: npm install -g npm@11

      - name: Build
        run: bash scripts/build.sh
        env:
          CF_PAGES_BRANCH: main
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Rewrite asset URLs BEFORE npm publish so CDN-hosted JS files
      # contain absolute CDN URLs for dynamic chunks (App.js, etc.)
      - name: Rewrite asset URLs to use CDN
        id: cdn
        run: |
          PKG_VERSION="0.0.0-g${GITHUB_SHA::8}"
          CDN_BASE="https://cdn.npmmirror.com/packages/werewolf-judge-cdn/${PKG_VERSION}/files"

          # JS bundles: rewrite "/assets/ string literals to CDN (Metro chunk references)
          for jsfile in dist/assets/js/*.js; do
            sed -i "s|\"/assets/|\"${CDN_BASE}/assets/|g" "$jsfile"
            # Replace WASM placeholder with versioned CDN URL for pre-compressed canvaskit
            sed -i "s|__CANVASKIT_WASM_GZ_URL__|${CDN_BASE}/wasm/canvaskit.wasm.gz|g" "$jsfile"
          done

          # HTML: rewrite src="/assets/... and href="/assets/... to CDN
          sed -i "s|src=\"/assets/|src=\"${CDN_BASE}/assets/|g" dist/index.html
          sed -i "s|href=\"/assets/|href=\"${CDN_BASE}/assets/|g" dist/index.html

          echo "cdn_base=$CDN_BASE" >> "$GITHUB_OUTPUT"
          echo "✅ All asset URLs rewritten to ${CDN_BASE}"

      # Publish REWRITTEN assets to npm → npmmirror CDN (OIDC trusted publishing, no token needed)
      - name: Publish assets to npm
        id: npm
        run: |
          PKG_VERSION="0.0.0-g${GITHUB_SHA::8}"
          WORK=$(mktemp -d)

          # Copy already-rewritten assets/ tree (JS bundles have CDN URLs baked in)
          cp -r dist/assets "$WORK/assets"

          # Pre-compress CanvasKit WASM for CDN delivery (8 MB → ~3.2 MB gzip).
          # Client fetches .wasm.gz and decompresses via DecompressionStream.
          # cp first: pnpm hardlinks node_modules files, gzip -k refuses multi-link targets.
          mkdir -p "$WORK/wasm"
          cp node_modules/canvaskit-wasm/bin/full/canvaskit.wasm "$WORK/wasm/canvaskit.wasm"
          gzip -9 "$WORK/wasm/canvaskit.wasm"

          # Generate index.js — importable manifest of all bundled assets
          FILES=$(cd "$WORK" && find assets wasm -type f | sort)
          {
            echo '"use strict";'
            echo "const VERSION = \"$PKG_VERSION\";"
            echo "const ASSETS = ["
            for f in $FILES; do
              echo "  \"$f\","
            done
            echo "];"
            echo "module.exports = { version: VERSION, assets: ASSETS };"
          } > "$WORK/index.js"

          cat > "$WORK/README.md" << 'EOF'
          # werewolf-judge-cdn

          Runtime asset loader and manifest for the [WerewolfJudge](https://github.com/olveryu/WerewolfGameJudge) web app.

          Provides a versioned manifest of all bundled assets (fonts, audio sprites, image bundles)
          so that Service Workers, deployment scripts, and build tools can enumerate and pre-cache them.

          ## Installation

          ```bash
          npm install werewolf-judge-cdn
          ```

          ## Usage

          ```js
          const { version, assets } = require('werewolf-judge-cdn');
          // version — semver string tied to the build commit
          // assets  — array of relative asset paths for cache pre-warming
          ```

          ## License

          MIT
          EOF
          # Trim leading spaces from heredoc (YAML indent)
          sed -i 's/^          //' "$WORK/README.md"

          printf '{"name":"werewolf-judge-cdn","version":"%s","description":"Runtime asset loader and manifest for the WerewolfJudge web app — fonts, audio sprites, and image bundles","license":"MIT","keywords":["werewolf","assets","manifest","loader"],"main":"index.js","files":["index.js","assets/","wasm/","README.md"],"repository":{"type":"git","url":"https://github.com/olveryu/WerewolfGameJudge.git"}}' "$PKG_VERSION" > "$WORK/package.json"
          cd "$WORK"
          # Idempotent publish: skip if this version already exists on npm
          # (happens when a reverted commit re-lands with the same SHA)
          if npm view "werewolf-judge-cdn@$PKG_VERSION" version \
            --registry=https://registry.npmjs.org/ --prefer-online \
            --fetch-retries=0 --fetch-timeout=15000 >/dev/null; then
            echo "⏭️ werewolf-judge-cdn@$PKG_VERSION already published — skipping"
          else
            npm publish --access public --tag latest
            echo "✅ Published werewolf-judge-cdn@$PKG_VERSION"
          fi

          # Gate: confirm version is visible on npm registry before proceeding.
          # Bound wall-clock time, including each registry request.
          MAX_WAIT_SECONDS=600
          REQUEST_TIMEOUT_SECONDS=15
          POLL_INTERVAL_SECONDS=5
          START_SECONDS=$SECONDS
          DEADLINE_SECONDS=$((START_SECONDS + MAX_WAIT_SECONDS))
          NPM_ERROR_FILE=$(mktemp)
          trap 'rm -f "$NPM_ERROR_FILE"' EXIT
          echo "⏳ Waiting for npm registry to confirm $PKG_VERSION..."
          while true; do
            REMAINING_SECONDS=$((DEADLINE_SECONDS - SECONDS))
            if [ "$REMAINING_SECONDS" -le 0 ]; then
              echo "❌ npm registry did not confirm $PKG_VERSION within ${MAX_WAIT_SECONDS}s — aborting"
              exit 1
            fi
            QUERY_TIMEOUT_SECONDS=$REQUEST_TIMEOUT_SECONDS
            if [ "$REMAINING_SECONDS" -lt "$QUERY_TIMEOUT_SECONDS" ]; then
              QUERY_TIMEOUT_SECONDS=$REMAINING_SECONDS
            fi
            if VERSION_CHECK=$(timeout "${QUERY_TIMEOUT_SECONDS}s" \
              npm view "werewolf-judge-cdn@$PKG_VERSION" version \
                --registry=https://registry.npmjs.org/ --prefer-online \
                --fetch-retries=0 --fetch-timeout=$((QUERY_TIMEOUT_SECONDS * 1000)) \
                2>"$NPM_ERROR_FILE"); then
              if [ "$VERSION_CHECK" = "$PKG_VERSION" ]; then
                echo "✅ npm registry confirms $PKG_VERSION (after $((SECONDS - START_SECONDS))s)"
                break
              fi
              echo "⚠️ npm registry returned unexpected version: ${VERSION_CHECK:-empty}"
            else
              QUERY_EXIT_CODE=$?
              echo "⚠️ npm registry query failed (exit=$QUERY_EXIT_CODE, elapsed=$((SECONDS - START_SECONDS))s)"
              cat "$NPM_ERROR_FILE" >&2
            fi
            REMAINING_SECONDS=$((DEADLINE_SECONDS - SECONDS))
            if [ "$REMAINING_SECONDS" -le 0 ]; then
              echo "❌ npm registry did not confirm $PKG_VERSION within ${MAX_WAIT_SECONDS}s — aborting"
              exit 1
            fi
            WAIT_SECONDS=$POLL_INTERVAL_SECONDS
            if [ "$REMAINING_SECONDS" -lt "$WAIT_SECONDS" ]; then
              WAIT_SECONDS=$REMAINING_SECONDS
            fi
            sleep "$WAIT_SECONDS"
          done

          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync npmmirror and verify CDN
        run: |
          set -euo pipefail

          PKG_VERSION="${{ steps.npm.outputs.version }}"
          CDN_BASE="https://cdn.npmmirror.com/packages/werewolf-judge-cdn/${PKG_VERSION}/files"
          SYNC_ENDPOINT="https://registry-direct.npmmirror.com/-/package/werewolf-judge-cdn/syncs"
          REGISTRY_URL="https://registry.npmmirror.com/werewolf-judge-cdn/${PKG_VERSION}"
          CDN_URL="${CDN_BASE}/index.js"
          CHECK_INTERVAL_SECONDS=5
          SYNC_RETRY_INTERVAL_SECONDS=180
          MAX_WAIT_SECONDS=900
          REQUEST_TIMEOUT_SECONDS=30
          NEXT_SYNC_AT_SECONDS=$SYNC_RETRY_INTERVAL_SECONDS
          REGISTRY_RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$REGISTRY_RESPONSE_FILE"' EXIT

          trigger_sync() {
            if ! SYNC_RESP=$(curl --fail --silent --show-error \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              --request PUT "$SYNC_ENDPOINT"); then
              echo "⚠️ npmmirror sync trigger failed; artifact polling will continue"
              return
            fi

            SYNC_ID=$(python3 -c \
              "import json,sys; data=json.load(sys.stdin); task_id=data['id']; assert task_id; print(task_id)" \
              <<< "$SYNC_RESP")
            echo "🔄 npmmirror sync triggered: $SYNC_ID"
          }

          report_sync_state() {
            if [ -z "$SYNC_ID" ]; then
              echo "ℹ️ No npmmirror sync task ID is available"
              return
            fi

            if ! SYNC_RESP=$(curl --fail --silent --show-error \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              "${SYNC_ENDPOINT}/${SYNC_ID}"); then
              echo "⚠️ Could not read npmmirror sync task $SYNC_ID"
              return
            fi

            STATE=$(python3 -c \
              "import json,sys; print(json.load(sys.stdin).get('state', 'unknown'))" \
              <<< "$SYNC_RESP")
            echo "ℹ️ npmmirror sync task $SYNC_ID state: $STATE (diagnostic only)"
          }

          SYNC_ID=""
          trigger_sync
          SECONDS=0

          while [ "$SECONDS" -le "$MAX_WAIT_SECONDS" ]; do
            if ! REGISTRY_HTTP_CODE=$(curl --silent --show-error \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              --output "$REGISTRY_RESPONSE_FILE" \
              --write-out "%{http_code}" \
              "$REGISTRY_URL"); then
              REGISTRY_HTTP_CODE="request-error"
              echo "⚠️ npmmirror registry request failed; retrying"
            fi

            VERSION_CHECK=""
            if [ "$REGISTRY_HTTP_CODE" = "200" ]; then
              VERSION_CHECK=$(python3 -c \
                "import json,sys; version=json.load(open(sys.argv[1]))['version']; assert isinstance(version, str); print(version)" \
                "$REGISTRY_RESPONSE_FILE")
            fi

            if ! CDN_HTTP_CODE=$(curl --silent --show-error \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$CDN_URL"); then
              CDN_HTTP_CODE="request-error"
              echo "⚠️ npmmirror CDN request failed; retrying"
            fi

            if [ "$VERSION_CHECK" = "$PKG_VERSION" ] && [ "$CDN_HTTP_CODE" = "200" ]; then
              echo "✅ npmmirror registry and CDN confirmed $PKG_VERSION after ${SECONDS}s"
              exit 0
            fi

            echo "⏳ Waiting for npmmirror artifacts (${SECONDS}s/${MAX_WAIT_SECONDS}s): registry=$REGISTRY_HTTP_CODE version=${VERSION_CHECK:-missing}, CDN=$CDN_HTTP_CODE"

            if [ "$SECONDS" -ge "$MAX_WAIT_SECONDS" ]; then
              break
            fi

            if [ "$SECONDS" -ge "$NEXT_SYNC_AT_SECONDS" ]; then
              report_sync_state
              trigger_sync
              NEXT_SYNC_AT_SECONDS=$((SECONDS + SYNC_RETRY_INTERVAL_SECONDS))
            fi

            sleep "$CHECK_INTERVAL_SECONDS"
          done

          report_sync_state
          echo "❌ npmmirror artifacts unavailable after ${MAX_WAIT_SECONDS}s — aborting deploy"
          echo "   Registry: $REGISTRY_URL → $REGISTRY_HTTP_CODE (${VERSION_CHECK:-missing})"
          echo "   CDN: $CDN_URL → $CDN_HTTP_CODE"
          if [ -n "$SYNC_ID" ]; then
            echo "   Last sync task: ${SYNC_ENDPOINT}/${SYNC_ID}"
          fi
          exit 1

      - name: Verify release CDN payload
        timeout-minutes: 3
        run: node scripts/verify-cdn-artifacts.mjs "${{ steps.cdn.outputs.cdn_base }}"

      # Cloudflare Pages API rejects non-ASCII commit messages.
      # Our convention: subject line (first line) is always ASCII (Conventional Commits).
      # Extract it explicitly so deployments stay human-readable + API-safe.
      - name: Extract commit subject
        id: commit
        run: echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: pages deploy dist --project-name=werewolfgamejudge --commit-message="${{ steps.commit.outputs.subject }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-miniapp:
    runs-on: ubuntu-latest
    if: |
      needs.quality.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-root.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, lint, test-root]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check miniapp changes
        id: changes
        run: |
          # Upload on release commits OR miniapp/ file changes
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if echo "$COMMIT_MSG" | grep -q '^release:'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD -- miniapp/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version-file: '.nvmrc'

      - name: Upload to WeChat Mini Program
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "${{ secrets.MINIAPP_UPLOAD_KEY }}" > /tmp/miniapp-key.pem
          VERSION=$(node -p "require('./package.json').version")
          npx miniprogram-ci upload \
            --pp miniapp \
            --pkp /tmp/miniapp-key.pem \
            --appid wx7f0c3bea5873908c \
            --uv "$VERSION" \
            --desc "CI deploy: $(git log -1 --pretty=%s)" \
            -r 1
          rm -f /tmp/miniapp-key.pem

  # Build the web bundle ONCE and share via artifact, instead of each e2e
  # shard running `expo export` independently (5x waste).
  build-web:
    runs-on: ubuntu-latest
    # Building needs types and lint to hold — unit test results are not a
    # build prerequisite (gate decoupling: tests report independently and
    # are enforced by ci-gate, not by chaining needs).
    if: |
      always() &&
      needs.quality.result == 'success' &&
      needs.lint.result == 'success'
    needs: [quality, lint]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Export web build
        run: |
          EXPO_PUBLIC_CF_API_URL=http://127.0.0.1:8787 \
          EXPO_PUBLIC_SENTRY_DSN='' \
          npx expo export --platform web

      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # The job body lives in e2e-run.yml (reusable workflow) — the same single
  # implementation e2e-single-spec.yml calls. This job contributes only the
  # gate, the shard matrix, and its parameters.
  e2e:
    # Decoupled gate: e2e's only hard input is the web dist from build-web
    # (plus quality/lint, which build-web already implies — listed here so
    # the needs context carries them for the explicit result checks below).
    # Unit and api-worker test results no longer gate e2e: they run in
    # parallel, report independently, and are enforced by ci-gate instead.
    if: |
      always() &&
      needs.quality.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.build-web.result == 'success'
    needs: [quality, lint, build-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Balanced by measured runtime (target ~10min wall each) ──
          - shard: '1'
            specs: 'werewolf-night-block.spec.ts werewolf-night-seed-wolf.spec.ts werewolf-night-special-roles.spec.ts'
          - shard: '2'
            specs: 'werewolf-night-protect.spec.ts werewolf-night-gargoyle.spec.ts'
          - shard: '3'
            specs: 'werewolf-night-kill.spec.ts werewolf-night-special-roles-2.spec.ts'
          - shard: '4'
            specs: 'werewolf-night-gun-status.spec.ts werewolf-night-check-interactions.spec.ts'
          - shard: '5'
            specs: 'werewolf-night-check.spec.ts werewolf-night-piper.spec.ts'
          - shard: '6'
            specs: 'resilience-reconnect.spec.ts werewolf-night-flow.spec.ts resilience-db-recovery.spec.ts'
          # avalon runs solo: a single 10-player full-game test (~7min,
          # 20min spec timeout) that cannot be split across shards.
          - shard: '7'
            specs: 'avalon.spec.ts'
          - shard: '8'
            specs: 'werewolf-night-completion.spec.ts pictionary.spec.ts resilience-restart.spec.ts resilience-offline-canary.spec.ts'
          - shard: '9'
            specs: 'undercover.spec.ts werewolf-seating.spec.ts fibking.spec.ts fibking-responsive.spec.ts storyrelay.spec.ts drawguess.spec.ts app-entry-flow.spec.ts app-home.spec.ts werewolf-config.spec.ts werewolf-sheriff-election.spec.ts app-room-lifecycle.spec.ts resilience-rejoin.spec.ts'
    uses: ./.github/workflows/e2e-run.yml
    with:
      specs: ${{ matrix.specs }}
      shard: ${{ matrix.shard }}
      build-web: false

  merge-reports:
    runs-on: ubuntu-latest
    if: always() && needs.e2e.result != 'skipped'
    needs: e2e
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload merged report artifact
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Pages artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  failure-digest:
    runs-on: ubuntu-latest
    # Maintains the single E2E failure-summary comment on the PR from the
    # per-shard failure bundles (scripts/e2e-failure-digest.mjs), and always
    # appends the same digest to the job step summary. On push-to-main runs
    # there is no PR, so the digest goes to the step summary only. Runs even
    # when e2e failed; skipped only when e2e itself was skipped.
    if: always() && needs.e2e.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    # Waits for the unit-test jobs as well as e2e: their result artifacts
    # must exist before the downloads below run, or unit failures would be
    # recorded only when the test jobs happened to finish first.
    needs: [e2e, test-root, test-api-worker]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # No failure-bundle artifacts exist when every shard was green; the
      # download then errors, which is expected — the digest script treats a
      # missing directory as "no failures recorded".
      - name: Download failure bundles
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: failure-bundle-*
          path: failure-bundles-in
          merge-multiple: true

      - name: Download unit test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-results-*
          path: test-results-in
          merge-multiple: true

      - name: Post failure digest to the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/e2e-failure-digest.mjs
          --bundles failure-bundles-in
          --test-results test-results-in
          --pr ${{ github.event.pull_request.number }}
          --repo ${{ github.repository }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --e2e-result ${{ needs.e2e.result }}

      # Push runs also maintain the rolling flake-ledger issue (--ledger):
      # e2e flaky/failures plus unit failures, aggregated per test in the
      # issue body. Record-only; see scripts/e2e-failure-digest.mjs.
      - name: Write failure digest to the step summary (push runs)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/e2e-failure-digest.mjs
          --bundles failure-bundles-in
          --test-results test-results-in
          --repo ${{ github.repository }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --run-id ${{ github.run_id }}
          --e2e-result ${{ needs.e2e.result }}
          --ledger

  deploy-e2e-report:
    runs-on: ubuntu-latest
    if: |
      needs.merge-reports.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: merge-reports
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Add report link to summary
        run: |
          echo "## 📊 Playwright Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 [View Report](${{ steps.deploy.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY

  # The single stable required status check (ruleset "push to main"
  # requires the context "ci-gate"). It aggregates the jobs that define
  # "mergeable" so the ruleset names ONE context instead of every matrix
  # shard — the matrices can grow or shrink without rotting the ruleset.
  # Any needed job that fails, is cancelled, or is skipped turns this
  # gate red; decoupled jobs therefore stay individually visible AND
  # collectively enforced.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, lint, test-root, test-api-worker, e2e]
    steps:
      - name: Assert every required job succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_ROOT_RESULT: ${{ needs.test-root.result }}
          TEST_API_WORKER_RESULT: ${{ needs.test-api-worker.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          failed=0
          for pair in \
            "quality=$QUALITY_RESULT" \
            "lint=$LINT_RESULT" \
            "test-root=$TEST_ROOT_RESULT" \
            "test-api-worker=$TEST_API_WORKER_RESULT" \
            "e2e=$E2E_RESULT"; do
            echo "$pair"
            if [ "${pair#*=}" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::ci-gate: at least one required job did not succeed"
            exit 1
          fi
          echo "ci-gate: all required jobs succeeded"
