name: E2E Single Spec

# Manual workflow for debugging a single e2e spec quickly.
# Skips quality and api-worker tests; only builds web and runs the specified spec.
#
# The branch under test is the dispatch ref, chosen by the caller — there is
# deliberately no `branch` input: a workflow_dispatch input can only change
# what checkout fetches, never which workflow definition executes, so a
# branch input misleads callers into believing the branch's workflow ran.
# Usage:
#   gh workflow run e2e-single-spec.yml --ref <branch> --field spec=<file>
# or in the Actions tab, pick the branch first, then Run workflow.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec filename (e.g. pictionary.spec.ts)'
        required: true
        type: string

# A repeated dispatch for the same branch + spec supersedes the previous
# run instead of queueing a second full build behind it.
concurrency:
  group: e2e-single-spec-${{ github.ref }}-${{ inputs.spec }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-single:
    uses: ./.github/workflows/e2e-run.yml
    with:
      specs: ${{ inputs.spec }}
      shard: single
      build-web: true
