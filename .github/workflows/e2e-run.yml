name: E2E Run (Reusable)

# The single implementation of "run a set of e2e specs on a runner".
# Callers pass parameters only; there is no second copy of these steps.
# - ci.yml calls this once per matrix shard with build-web: false and
#   downloads the web-dist artifact its build-web job produced.
# - e2e-single-spec.yml calls this with build-web: true and builds the
#   web bundle inline, since it runs standalone.
# - suite: visual runs the screenshot gate (e2e/visual) through
#   scripts/e2e-visual.mjs inside the pinned Playwright image; ci.yml's
#   e2e-visual job compares, e2e-visual.yml (manual) compares or rewrites the baselines.

on:
  workflow_call:
    inputs:
      specs:
        description: 'Space-separated spec filenames under e2e/specs/ (e.g. "avalon.spec.ts fibking.spec.ts")'
        required: true
        type: string
      shard:
        description: 'Shard label used for artifact names and the failure-bundle shard tag (e.g. "1", "single")'
        required: true
        type: string
      build-web:
        description: 'true: export the web bundle inline. false: download the caller-provided web-dist artifact.'
        required: true
        type: boolean
      suite:
        description: 'e2e: specs under e2e/specs/ on the runner. visual: the screenshot gate under e2e/visual/, inside the pinned Playwright image.'
        required: false
        default: e2e
        type: string
      update-snapshots:
        description: 'visual only: rewrite the baselines and upload them as the visual-baselines artifact.'
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    # Hard bound for a hung run: the slowest measured shard is ~10min of
    # specs plus setup; 45min leaves ample headroom while replacing the
    # 360min GitHub default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # Fail fast on a typo'd or uncommitted spec name, before paying for
      # install + web export + browser download only to hear
      # "No tests found" from Playwright.
      - name: Validate spec files exist
        env:
          SPECS: ${{ inputs.specs }}
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            e2e) dir=e2e/specs ;;
            visual) dir=e2e/visual ;;
            *)
              echo "::error::Unknown suite: $SUITE (expected e2e or visual)"
              exit 1
              ;;
          esac
          for spec in $SPECS; do
            case "$spec" in
              */*)
                echo "::error::Spec must be a bare filename, not a path: $spec"
                exit 1
                ;;
            esac
            if [ ! -f "$dir/$spec" ]; then
              echo "::error::Spec not found: $dir/$spec"
              exit 1
            fi
            echo "Found $dir/$spec"
          done

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build web
        if: ${{ inputs.build-web }}
        run: |
          VITE_CF_API_URL=http://127.0.0.1:8787 \
          VITE_SENTRY_DSN='' \
          pnpm --filter @game-judge/web run build

      # Download the pre-built web bundle from the caller's build-web job.
      - name: Download web dist
        if: ${{ !inputs.build-web }}
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: packages/web/dist/

      # The visual suite runs in the Playwright image, which ships its browsers.
      - name: Get Playwright version
        if: inputs.suite == 'e2e'
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.suite == 'e2e'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: inputs.suite == 'e2e' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: inputs.suite == 'e2e' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Apply D1 migrations as a dedicated step (not buried inside the
      # Playwright webServer) so migration failures fail fast with clear
      # logs instead of hanging the test step with no visible cause.
      - name: Setup D1 migrations
        run: node scripts/setup-d1-migrations.mjs

      - name: Run E2E tests (shard ${{ inputs.shard }})
        if: inputs.suite == 'e2e'
        env:
          SPECS: ${{ inputs.specs }}
          E2E_BUNDLE_RUN_ID: ${{ github.run_id }}
          E2E_BUNDLE_SHARD: ${{ inputs.shard }}
        run: pnpm exec playwright test $SPECS --reporter=list,blob,./e2e/reporters/failureBundle.ts

      - name: Run visual gate (shard ${{ inputs.shard }})
        if: inputs.suite == 'visual'
        env:
          SPECS: ${{ inputs.specs }}
          UPDATE: ${{ inputs.update-snapshots }}
        run: |
          if [ "$UPDATE" = "true" ]; then
            node scripts/e2e-visual.mjs --update $SPECS
          else
            node scripts/e2e-visual.mjs $SPECS
          fi

      # Expected, actual and diff PNGs of every failed comparison: plain images
      # that open on a phone straight from the run page.
      - name: Upload visual diffs
        uses: actions/upload-artifact@v7
        if: inputs.suite == 'visual' && failure()
        with:
          name: visual-diff-${{ inputs.shard }}
          path: test-results-visual/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload visual baselines
        uses: actions/upload-artifact@v7
        if: inputs.suite == 'visual' && inputs.update-snapshots
        with:
          name: visual-baselines
          path: e2e/visual/__screenshots__/
          if-no-files-found: error
          retention-days: 7

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'e2e'
        with:
          name: blob-report-${{ inputs.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload failure bundle
        uses: actions/upload-artifact@v7
        if: always() && inputs.suite == 'e2e'
        with:
          name: failure-bundle-${{ inputs.shard }}
          path: failure-bundles/
          if-no-files-found: ignore
          retention-days: 30
