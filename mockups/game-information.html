<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>房间信息区 · 交互原型</title>
    <link rel="stylesheet" href="./action-hand.css" />
    <link rel="stylesheet" href="./game-information.css" />
    <script defer src="./game-information.js"></script>
  </head>
  <body>
    <header class="comparison-toolbar preview-controls">
      <h1>房间信息区原型</h1>
      <label for="game-select">游戏</label>
      <select id="game-select">
        <option value="avalon">阿瓦隆</option>
        <option value="hitler">秘密希特勒</option>
      </select>
      <label for="phase-select">阶段</label>
      <select id="phase-select">
        <option value="setup">开局前</option>
        <option value="playing" selected>进行中</option>
        <option value="result">结果展示</option>
        <option value="ended">本局结束</option>
      </select>
    </header>

    <main class="information-preview">
      <section class="game-screen" aria-label="房间预览">
        <header class="room-header">
          <div>
            <h2 id="game-title">阿瓦隆</h2>
            <p>房间 6X9K · 7 位玩家 · 玩家视角</p>
          </div>
          <button type="button" class="icon-button" aria-label="个人设置">⚙</button>
        </header>

        <div class="room-scroll">
          <section class="board-information" aria-label="本局信息">
            <div class="phase">
              <span id="phase-context" class="night-label"></span>
              <h2 id="phase-title"></h2>
              <p id="phase-description"></p>
            </div>
            <div id="setup-info" hidden></div>
            <div id="tracks" hidden></div>
            <p id="latest-result" class="latest-result" hidden></p>
          </section>
          <section id="board" class="board" aria-label="玩家座位"></section>
        </div>

        <section class="action-hand" aria-label="行动手牌">
          <div class="hand-body">
            <div class="card-row" style="--card-count: 4">
              <button type="button" class="hand-card action-primary" id="action-button">
                <span aria-hidden="true">✦</span><strong id="action-label">组队</strong>
              </button>
              <button type="button" class="hand-card" data-category="resources" id="history-button">
                <span aria-hidden="true">▤</span><strong>对局记录</strong>
              </button>
              <button
                type="button"
                class="hand-card"
                data-category="resources"
                id="configuration-button"
              >
                <span aria-hidden="true">◇</span><strong>本局配置</strong>
              </button>
              <button type="button" class="hand-card" data-category="resources" id="manual-button">
                <span aria-hidden="true">☰</span><strong>手册</strong>
              </button>
            </div>
          </div>
        </section>
      </section>
      <aside class="preview-notes">
        <h2>怎么体验</h2>
        <p>切换游戏与阶段，查看手机房间中的信息层次。结果会展示 5 秒后自动关闭。</p>
        <p>进行中可点座位模拟草稿，再点政策格或记录；在弹窗中可模拟结果打断和恢复。</p>
        <p>这是 7 人示例，不连接真实对局。规则和记录仅用于展示布局。</p>
      </aside>
    </main>

    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <h2 id="detail-title"></h2>
      <div id="detail-content"></div>
      <button id="simulate-result" type="button" class="secondary-button">模拟结果到达</button>
      <form method="dialog"><button class="secondary-button" autofocus>关闭</button></form>
    </dialog>
    <dialog id="result-dialog" aria-labelledby="result-title" aria-describedby="result-copy">
      <p class="result-eyebrow">公开结果</p>
      <h2 id="result-title"></h2>
      <p id="result-copy"></p>
      <p class="result-timer"><span id="result-seconds">5</span> 秒后自动关闭</p>
    </dialog>
  </body>
</html>
